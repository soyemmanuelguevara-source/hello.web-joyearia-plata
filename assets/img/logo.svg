<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 180" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Joyería de Plata</title>
  <defs>
    <linearGradient id="gemSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="45%" stop-color="#C7C9CE"/>
      <stop offset="100%" stop-color="#8E9096"/>
    </linearGradient>
    <linearGradient id="bandSilver" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="26%" stop-color="#E8E9EC"/>
      <stop offset="52%" stop-color="#B4B6BB"/>
      <stop offset="74%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#A6A8AD"/>
    </linearGradient>
    <linearGradient id="gemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E27A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A9821A"/>
    </linearGradient>
  </defs>

  <!-- Ring mark: solitaire (band + brilliant-cut gem) -->
  <g>
    <!-- Gem, drawn first so the band overlaps its culet -->
    <g>
      <!-- Pavilion -->
      <polygon points="50,54 80,54 80,90" fill="#9A9CA1"/>
      <polygon points="80,54 110,54 80,90" fill="#7C7E84"/>
      <polygon points="69,54 91,54 80,90" fill="#D9DADD"/>
      <!-- Crown -->
      <polygon points="63,32 50,54 69,54" fill="#EDEDEF"/>
      <polygon points="97,32 110,54 91,54" fill="#C7C9CE"/>
      <polygon points="63,32 97,32 91,54 69,54" fill="#FFFFFF"/>
      <!-- Girdle + facet lines -->
      <line x1="50" y1="54" x2="110" y2="54" stroke="#5C5E63" stroke-width="1.2"/>
      <line x1="69" y1="54" x2="63" y2="32" stroke="#5C5E63" stroke-width="0.8" opacity="0.45"/>
      <line x1="91" y1="54" x2="97" y2="32" stroke="#5C5E63" stroke-width="0.8" opacity="0.45"/>
      <line x1="69" y1="54" x2="80" y2="90" stroke="#5C5E63" stroke-width="0.8" opacity="0.4"/>
      <line x1="91" y1="54" x2="80" y2="90" stroke="#5C5E63" stroke-width="0.8" opacity="0.4"/>
      <!-- Prongs -->
      <path d="M50,54 L47,64" stroke="url(#gemGold)" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M110,54 L113,64" stroke="url(#gemGold)" stroke-width="3.4" stroke-linecap="round"/>
    </g>

    <!-- Band -->
    <circle cx="80" cy="122" r="36" fill="none" stroke="url(#bandSilver)" stroke-width="8.5"/>
    <circle cx="80" cy="122" r="40.3" fill="none" stroke="#5C5E63" stroke-width="0.9" opacity="0.55"/>
    <circle cx="80" cy="122" r="31.7" fill="none" stroke="#5C5E63" stroke-width="0.9" opacity="0.55"/>
    <path d="M52.5,99 A36,36 0 0 1 72,87" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
    <path d="M104,138 A36,36 0 0 1 92,152" fill="none" stroke="url(#gemGold)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Sparkles -->
    <path d="M126,24 Q127.6,33.8 139,37 Q127.6,40.2 126,50 Q124.4,40.2 113,37 Q124.4,33.8 126,24 Z" fill="url(#gemGold)"/>
    <path d="M32,70 Q33,76.4 40,78 Q33,79.6 32,86 Q31,79.6 24,78 Q31,76.4 32,70 Z" fill="url(#gemGold)" opacity="0.75"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(172,74)" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif">
    <text x="0" y="0" font-size="46" font-weight="600" letter-spacing="1" fill="#F5F5F5">Joyer&#237;a</text>
    <text x="0" y="46" font-size="46" font-weight="600" letter-spacing="1" fill="url(#gemGold)" font-style="italic">de Plata</text>
  </g>
</svg>
