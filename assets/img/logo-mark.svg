  </defs>

  <rect width="160" height="160" rx="34" fill="#0A0A0C"/>
  <rect x="3" y="3" width="154" height="154" rx="31" fill="none" stroke="url(#mkGold)" stroke-width="1.6" opacity="0.5"/>

  <g transform="translate(0,6)">
