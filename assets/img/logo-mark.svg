    <path d="M105,44 L108,52" stroke="url(#mkGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Band -->
    <circle cx="80" cy="102" r="30" fill="none" stroke="url(#mkBand)" stroke-width="7.5"/>
    <circle cx="80" cy="102" r="33.8" fill="none" stroke="#5C5E63" stroke-width="0.8" opacity="0.55"/>
    <circle cx="80" cy="102" r="26.2" fill="none" stroke="#5C5E63" stroke-width="0.8" opacity="0.55"/>
    <path d="M57,83 A30,30 0 0 1 73,73" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
