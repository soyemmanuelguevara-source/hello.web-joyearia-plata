<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="markTitle">
  <title id="markTitle">Joyería de Plata</title>
  <defs>
    <linearGradient id="mkBand" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="26%" stop-color="#E8E9EC"/>
      <stop offset="52%" stop-color="#B4B6BB"/>
      <stop offset="74%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#A6A8AD"/>
    </linearGradient>
    <linearGradient id="mkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E27A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A9821A"/>
